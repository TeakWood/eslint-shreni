name: CI
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    # The type-check gate, as its own job rather than a step inside Verify
    # Files. A type error then fails on its own line instead of behind whichever
    # of that job's many checks happens to run first, and it reports without
    # waiting on the docs install and the rest of the lint suite.
    type_check:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"

            - name: Install Packages
              run: npm install

            # Type-checks every source in the `tsconfig.json` allowlist under
            # `strict: true`. Non-zero exit fails the job, which blocks the PR.
            - name: Check Types
              run: npm run lint:types

            # Type-checking alone does not prove the declarations can be
            # generated: declaration emit has failure modes `--noEmit` cannot
            # see, such as a specifier that resolves in the source but not from
            # the emitted `.d.ts`.
            - name: Build Type Declarations
              run: npm run build:types

    verify_files:
        name: Verify Files
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version: "stable"
            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"

            - name: Lint GitHub Actions workflows
              run: |
                  go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
                  actionlint -color -shellcheck= -pyflakes=

            - name: Install Packages
              run: npm install

            - name: Install Docs Packages
              working-directory: docs
              run: npm install

            # Also type-checks the allowlist, so a type error fails the local
            # `npm run lint` gate too. The Type Check job is what reports it
            # in isolation.
            - name: Lint Files
              run: node Makefile lint

            - name: Check Rule Files
              run: node Makefile checkRuleFiles

            - name: Check Licenses
              run: node Makefile checkLicenses

            - name: Lint Docs JS Files
              run: node Makefile lintDocsJS

            - name: Check Rule Examples
              run: node Makefile checkRuleExamples

            - name: Lint Files, Dependencies, & Exports
              run: npm run lint:unused

            - name: Check Formatting
              run: npm run fmt:check

    test_on_node:
        name: Test
        strategy:
            matrix:
                os: [ubuntu-latest]
                node: [26.x, 24.x, 22.x, 20.x, "20.19.0"]
                NODE_OPTIONS: [""]
                include:
                    - os: windows-latest
                      node: "lts/*"
                    - os: macOS-latest
                      node: "lts/*"
                    - os: ubuntu-latest
                      node: 24.x

                      # `--experimental-strip-types` is enabled by default in Node.js 24.x.
                      # This additional environment is necessary only to test `--experimental-transform-types`,
                      # as it is not enabled by default in any Node.js version yet.
                      NODE_OPTIONS: "--experimental-transform-types"
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
            - name: Install Packages
              run: npm install
            - name: Test
              env:
                  NODE_OPTIONS: ${{ matrix.NODE_OPTIONS }}
              run: node Makefile mocha
            - name: Fuzz Test
              run: node Makefile fuzz
            - name: Test EMFILE Handling
              run: npm run test:emfile

    test_on_browser:
        name: Browser Test
        runs-on: ubuntu-latest
        env:
            TERM: xterm-256color
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24" # Should be the same as the version used on Netlify to build the ESLint Playground

            # Node 24.18.0 bundles npm 11.16.0, which has a bug where denying a package's
            # install scripts via `allowScripts` also drops its `.bin` links.
            # Fixed in npm 11.18.0. See https://github.com/npm/cli/issues/9681
            - name: Update npm
              run: npm install -g npm@latest
            - name: Install Packages
              run: npm install
            - name: Test
              run: node Makefile cypress
            - name: Fuzz Test
              run: node Makefile fuzz

    test_package_manager:
        name: Test Package Managers
        uses: eslint/workflows/.github/workflows/ci-package-manager.yml@main

    pnpm_test:
        name: Test pnpm Type Support
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: latest

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"

            - name: Run pnpm test
              run: npm run test:pnpm
